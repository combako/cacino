<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Суета Шоп</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header-box {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .balance-badge {
            color: #f1c40f;
            font-size: 18px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .name { font-weight: bold; font-size: 14px; }
        .price { color: #f1c40f; margin: 8px 0; font-weight: bold; }
        .btn {
            background-color: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <div>🔥 ТВОЙ БАЛАНС: <span class="balance-badge" id="user-balance">0</span> ⭐</div>
    </div>
    
    <div class="grid" id="catalog"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Достаем баланс из URL параметров
        const urlParams = new URLSearchParams(window.location.search);
        const userBalance = urlParams.get('balance') || 0;
        document.getElementById('user-balance').innerText = userBalance;

        const cfg = {
            "heart": {"name": "Сердечко", "emoji": "❤️", "price": 16},
            "bear": {"name": "Мишка", "emoji": "🧸", "price": 16},
            "box": {"name": "Бокс с баблом", "emoji": "🎁", "price": 26},
            "rose": {"name": "Роза от Мелла", "emoji": "🌹", "price": 26},
            "cake": {"name": "Элитный торт", "emoji": "🎂", "price": 51},
            "rocket": {"name": "Ракета", "emoji": "🚀", "price": 51}
        };

        const catalog = document.getElementById('catalog');

        Object.keys(cfg).forEach(key => {
            const item = cfg[key];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="icon">${item.emoji}</div>
                <div class="name">${item.name}</div>
                <div class="price">${item.price} ⭐</div>
                <button class="btn" onclick="buyItem('${key}')">Купить</button>
            `;
            catalog.appendChild(card);
        });

        function buyItem(key) {
            tg.sendData(key); // Отправляем ID товара в бот
            tg.close();       // Закрываем веб-апп, чтобы открылся инвойс
        }
    </script>
</body>
</html>
